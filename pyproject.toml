[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlip"
version = "0.1.0"
description = "Reinforcement Learning Interaction Protocol – connect AI agents to RL environments via a Claude Code plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RLIP Contributors" }]
keywords = ["reinforcement-learning", "mcp", "claude", "gymnasium", "ai-agent", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # MCP (Model Context Protocol) SDK – Claude Code plugin transport
    "mcp>=1.0.0",
    # RL environment standard
    "gymnasium>=0.29.0",
    # Data validation
    "pydantic>=2.0.0",
    # HTTP server for standalone RLIP server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # HTTP client for remote RLIP connections
    "httpx>=0.27.0",
    # Numpy for observation/action arrays
    "numpy>=1.24.0",
    # Image rendering support
    "pillow>=10.0.0",
    # CLI
    "typer>=0.12.0",
    # Rich terminal output
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Common RL environment sets
examples     = ["gymnasium[classic-control]>=0.29.0"]
envs-classic = ["gymnasium[classic-control]>=0.29.0"]
envs-box2d   = ["gymnasium[box2d]>=0.29.0"]
envs-atari   = ["gymnasium[atari]>=0.29.0", "ale-py>=0.8.0"]
envs-mujoco  = ["gymnasium[mujoco]>=0.29.0"]
# All built-in envs
envs-all     = ["gymnasium[all]>=0.29.0", "ale-py>=0.8.0"]
# Non-MCP frontends (Ollama, OpenAI, LM Studio, etc.)
# httpx is already a core dep so no extra install needed for Ollama;
# install openai-sdk only if you prefer the official client.
openai-sdk = ["openai>=1.30.0"]
# GPU-accelerated DQN / PPO training (also works CPU-only)
torch = ["torch>=2.0.0"]

# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
# Standalone RLIP HTTP server
rlip-server  = "rlip.__main__:server_app"
# MCP plugin entry-point (used by Claude Code)
rlip-mcp     = "rlip.mcp_plugin.plugin:main"
# Utility CLI
rlip         = "rlip.__main__:app"

[project.urls]
Homepage   = "https://github.com/your-org/rlip"
Repository = "https://github.com/your-org/rlip"
Issues     = "https://github.com/your-org/rlip/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rlip"]

[tool.hatch.build.targets.sdist]
include = ["src/", "examples/", "docs/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
target-version = "py310"
line-length    = 100

[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true
