[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "rlbridge"
version = "0.1.4"
description = "Reinforcement Learning Bridge - connects LLMs to RL environments, automates language-based problem construction, and derives instructions for long-term goals without user supervision"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Philip Osborne" }]
keywords = [
    "reinforcement-learning",
    "mcp",
    "claude",
    "gymnasium",
    "ai-agent",
    "llm",
    "instruction-following",
    "rl",
    "rlbridge",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=1.0.0",
    "gymnasium>=0.29.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
examples = ["gymnasium[classic-control]>=0.29.0"]
envs-classic = ["gymnasium[classic-control]>=0.29.0"]
envs-box2d = ["gymnasium[box2d]>=0.29.0"]
envs-atari = ["gymnasium[atari]>=0.29.0", "ale-py>=0.8.0"]
envs-mujoco = ["gymnasium[mujoco]>=0.29.0"]
envs-all = ["gymnasium[all]>=0.29.0", "ale-py>=0.8.0"]
openai-sdk = ["openai>=1.30.0"]
torch = ["torch>=2.0.0"]
sentence-transformers = ["sentence-transformers>=2.6.0"]
dev = [
    "build>=1.2.0",
    "hatchling>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "twine>=5.0.0",
]

[project.scripts]
rlbridge-server = "rlbridge.__main__:server_app"
rlbridge-mcp = "rlbridge.mcp_plugin.plugin:main"
rlbridge = "rlbridge.__main__:app"

[project.urls]
Homepage = "https://github.com/pdfosborne/RL-IP"
Documentation = "https://github.com/pdfosborne/RL-IP#readme"
Repository = "https://github.com/pdfosborne/RL-IP"
Issues = "https://github.com/pdfosborne/RL-IP/issues"
Changelog = "https://github.com/pdfosborne/RL-IP/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/rlbridge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "examples/",
    "docs/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv]
dev-dependencies = [
    "build>=1.2.0",
    "hatchling>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "twine>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
